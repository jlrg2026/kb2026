<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Knowledge Base DERMAVAN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0f2f5;--card:#fff;--text:#2d3748;--mut:#718096;--bd:#e2e8f0;--pri:#0078d4;--priD:#005a9e;--acc:#f39c12;--ok:#38a169;--warn:#dd6b20;--bad:#e53e3e;--soft:#e6f2fc;--hd:linear-gradient(135deg,#1e3a5f,#0f1e33);--sh:0 2px 10px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1419;--card:#1a202c;--text:#f7fafc;--mut:#a0aec0;--bd:#2d3748;--soft:#223a57}}
:root[data-theme=dark]{--bg:#0f1419;--card:#1a202c;--text:#f7fafc;--mut:#a0aec0;--bd:#2d3748;--soft:#223a57}
html{scroll-padding-top:130px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:90px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:var(--hd);color:#fff;position:sticky;top:0;z-index:50;padding:10px 16px calc(10px) 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:var(--sh)}
.bar{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.bar h1{font-size:17px;flex:1;white-space:nowrap}
.bar h1 small{opacity:.7;font-weight:400;font-size:12px;margin-left:6px}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;position:relative}
.ib:hover{background:rgba(255,255,255,.25)}
.ib .n{background:var(--acc);border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.search{max-width:1100px;margin:10px auto 0;display:flex;gap:8px}
.search input{flex:1;padding:12px 14px;border-radius:10px;border:2px solid transparent;background:#fff;color:#2d3748;font-size:15px}
.search input:focus{border-color:var(--acc);outline:0}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
#banner{display:none;background:#fff4e5;color:#9c4a00;border:1px solid #f6c98d;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left}
.stat b{display:block;font-size:20px;line-height:1.1}.stat span{font-size:11px;color:var(--mut)}
.stat.on{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,120,212,.18)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.cat{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px}
.cat b{color:var(--mut);font-weight:600;margin-left:4px}
.cat.on{background:var(--pri);border-color:var(--pri);color:#fff}.cat.on b{color:#dbeafe}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--soft);color:var(--pri);border:0;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600}
.count{margin-left:auto;font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:10px;padding:14px;cursor:pointer;position:relative;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--pri)}
.card.Alta{border-left-color:var(--bad)}.card.Media{border-left-color:var(--warn)}.card.Baja{border-left-color:var(--ok)}
.card h3{font-size:15px;line-height:1.3;padding-right:34px}
.card p{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mut)}
.tag{background:var(--soft);color:var(--pri);border-radius:5px;padding:1px 7px;font-weight:600;font-size:11px}
.tag.Alta{background:#ffe5e5;color:var(--bad)}.tag.Media{background:#fff4e5;color:var(--warn)}.tag.Baja,.tag.Resuelto{background:#e6f9ec;color:var(--ok)}
.star{position:absolute;top:8px;right:8px;background:none;border:0;font-size:20px;color:var(--mut);padding:2px 6px}
.star.on{color:var(--acc)}
mark{background:#fde68a;color:#000;border-radius:2px}
.more{display:block;margin:16px auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 20px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--mut)}
.sk{height:120px;border-radius:10px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
#detail{display:none;max-width:800px;margin:0 auto;padding:16px}
.dbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{color:var(--bad)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.sec.sol{border-left:5px solid var(--ok)}
.sec h4{font-size:12px;color:var(--mut);margin-bottom:8px}
.md{white-space:pre-wrap;font-size:15px}
.step{display:flex;gap:10px;white-space:normal;margin:4px 0}.step b{flex:none;background:var(--soft);color:var(--pri);border-radius:50%;min-width:24px;height:24px;text-align:center;line-height:24px;font-size:12px}
.md code{background:var(--soft);border-radius:4px;padding:0 5px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.code{position:relative;background:#0f1e33;color:#e2e8f0;border-radius:8px;margin:8px 0;white-space:normal}
.code pre{padding:12px;overflow-x:auto;font:13px ui-monospace,Consolas,monospace;white-space:pre}
.code button{position:absolute;top:6px;right:6px;font-size:11px;border:0;border-radius:6px;padding:3px 8px;background:#2d3f5c;color:#fff}
.att{display:block;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;color:var(--pri);text-decoration:none;word-break:break-all}
.att img{max-width:100%;border-radius:6px;display:block;margin-top:6px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;font-size:30px;box-shadow:0 4px 16px rgba(243,156,18,.5);z-index:60}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.ov.on{display:flex}
.modal{background:var(--card);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:900px){.ov{align-items:center}.modal{border-radius:18px}}
.modal h2{font-size:18px;margin-bottom:14px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font-size:15px}
.fg textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arow{display:grid;grid-template-columns:1fr 1.5fr auto;gap:6px;margin-bottom:6px}
.arow input{padding:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:300}
.toast.on{opacity:1}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.bar h1 small{display:none}.arow{grid-template-columns:1fr auto}.arow input:first-child{grid-column:1/-1}.row{grid-template-columns:1fr}}
@media print{body>*:not(#detail){display:none!important}#detail{display:block!important}.dbar{display:none}.sec{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Knowledge Base <small>DERMAVAN</small></h1>
    <button class="ib" id="bFav" title="Solo favoritos">⭐ Favoritos<span class="n" id="favN" hidden>0</span></button>
    <button class="ib" id="bSync" title="Sincronizar"><span id="dot">🟢</span> Sync</button>
    <button class="ib" id="bCsv" title="Exportar a CSV">⬇ CSV</button>
    <button class="ib" id="bTheme" title="Cambiar tema">🌓</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Buscar en SAP, Cotizador, Red… (tecla / )" autocomplete="off" aria-label="Buscar"></div>
</header>

<main id="list" class="wrap">
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="cats" id="cats"></div>
  <div class="tools">
    <select id="sPri" aria-label="Prioridad"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option></select>
    <select id="sEst" aria-label="Estado"><option value="">Todo estado</option><option value="pend">Pendientes</option><option>Abierto</option><option>En progreso</option><option>Resuelto</option></select>
    <select id="sSort" aria-label="Orden"><option value="recent">Más recientes</option><option value="oldest">Más antiguos</option><option value="priority">Por prioridad</option><option value="title">Título A-Z</option></select>
    <div class="chips" id="chips"></div>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <button class="more" id="more" hidden>Cargar más</button>
</main>

<section id="detail"></section>
<button class="fab" id="fab" title="Nuevo artículo" aria-label="Nuevo artículo">+</button>

<div class="ov" id="ov">
  <form class="modal" id="form" autocomplete="off">
    <h2 id="mTitle">Nuevo artículo</h2>
    <input type="hidden" id="fId">
    <div class="fg"><label for="fTit">Título *</label><input id="fTit" required placeholder="Ej: Error al timbrar factura en SAP"></div>
    <div class="row">
      <div class="fg"><label for="fCat">Categoría *</label><select id="fCat" required></select></div>
      <div class="fg"><label for="fPri">Prioridad</label><select id="fPri"><option>Baja</option><option selected>Media</option><option>Alta</option></select></div>
    </div>
    <div class="fg"><label for="fEst">Estado</label><select id="fEst"><option>Abierto</option><option>En progreso</option><option selected>Resuelto</option></select></div>
    <div class="fg"><label for="fDes">Descripción del problema</label><textarea id="fDes" placeholder="Describe el problema o síntoma…"></textarea></div>
    <div class="fg"><label for="fSol">Solución / procedimiento</label><textarea id="fSol" placeholder="Pasos numerados (1. 2. 3.), **negritas**, `código` o bloques con ```"></textarea></div>
    <div class="fg"><label for="fNot">Notas adicionales</label><textarea id="fNot" style="min-height:60px"></textarea></div>
    <div class="fg"><label>Adjuntos (enlaces de Drive, OneDrive…)</label><div id="atts"></div><button type="button" class="btn" id="addAtt" style="width:100%;border-style:dashed">+ Agregar adjunto</button></div>
    <button class="btn p" style="width:100%;padding:13px" id="save">Guardar artículo</button>
    <button type="button" class="btn" style="width:100%;margin-top:8px" id="cancel">Cancelar</button>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ===== CONFIG =====
const API_URL='https://script.google.com/macros/s/AKfycbxqnThd4OIvnLF4JMN0mgpi1aIdToRNYN2DtjvqDqHRYdv6c7ZqPQ6-I2nk6yiCFfWw/exec';
const CATS=['Cotizador','CRM Harmony','DERMAVANLAB','DIRECCION','Hardware','POWER BI','Proceso','Red','SAP','Software','Otro'];
const PAGE=24, LS={cache:'kb_articles_cache',bm:'kb_bookmarks',theme:'kb_theme',draft:'kb_draft'};
const S={arts:[],q:'',cat:'',est:'',pri:'',fav:false,sort:'recent',shown:PAGE,y:0,inApp:false,dirty:false};
const $=id=>document.getElementById(id);

// ===== UTILIDADES =====
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'#';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2500)}
function ago(v){const d=new Date(v);if(!v||isNaN(d))return '';const n=Math.floor((Date.now()-d)/864e5);
  if(n<=0)return 'hoy';if(n===1)return 'ayer';if(n<30)return 'hace '+n+' días';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}
function atts(a){try{const x=typeof a['Adjuntos']==='string'?JSON.parse(a['Adjuntos']||'[]'):(a['Adjuntos']||[]);return Array.isArray(x)?x.filter(f=>f&&f.url):[]}catch{return []}}
const bms=()=>new Set(store.get(LS.bm,[]).map(String));
function hl(text){let h=esc(text);const ws=norm(S.q).split(/\s+/).filter(w=>w.length>1&&!/[&<>"'#;]/.test(w));
  ws.forEach(w=>{h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return h}

// Mini-Markdown seguro: pasos numerados, viñetas, **negrita**, `código`, bloques ```
function md(t){if(!t)return '—';const blocks=[];
  t=String(t).replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(c.trim());return '\u0000'+(blocks.length-1)+'\u0000'});
  t=esc(t).replace(/^(\d+)\.\s+(.*)(\n|$)/gm,'<div class="step"><b>$1</b><span>$2</span></div>')
    .replace(/^[-•]\s+(.*)(\n|$)/gm,'<div class="step"><b>•</b><span>$1</span></div>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<div class="code"><button type="button" data-copy>Copiar</button><pre>'+esc(blocks[i])+'</pre></div>')}

// ===== API (JSONP, token pedido como PIN; ya no va en el código) =====
function getToken(force){let t=force?null:sessionStorage.getItem('kb_tok');
  if(!t){t=prompt('PIN / token de acceso');if(t)sessionStorage.setItem('kb_tok',t.trim())}return t&&t.trim()}
function dot(s){$('dot').textContent=s==='sync'?'🟠':s==='err'?'🔴':'🟢'}
function api(action,extra={}){return new Promise((res,rej)=>{
  const tok=getToken();if(!tok)return rej(new Error('Se requiere el PIN'));
  const cb='kbcb_'+Date.now()+Math.floor(Math.random()*1e5),p=new URLSearchParams({action,token:tok,...extra,callback:cb});
  const url=API_URL+'?'+p;if(url.length>7500)return rej(new Error('El contenido es demasiado largo para enviarse (reduce texto o adjuntos)'));
  dot('sync');const s=document.createElement('script');
  const done=()=>{delete window[cb];s.remove();clearTimeout(to)};
  const to=setTimeout(()=>{done();dot('err');rej(new Error('Tiempo agotado'))},25000);
  window[cb]=d=>{done();if(d&&d.error){dot('err');if(/token|auth|autoriz/i.test(d.error))sessionStorage.removeItem('kb_tok');rej(new Error(d.error))}else{dot('ok');res(d)}};
  s.onerror=()=>{done();dot('err');rej(new Error('No se pudo conectar'))};
  s.src=url;document.body.appendChild(s)})}

function prep(list){list.forEach(a=>{a._h=norm([a['Título'],a['Descripción'],a['Solución'],a['Notas'],a['Categoría']].join(' '))});return list}
async function pull(msg){try{const d=await api('list');S.arts=prep(d.articles||[]);store.set(LS.cache,{articles:d.articles||[],ts:Date.now()});
    $('banner').style.display='none';render();route();if(msg)toast('✅ Sincronizado: '+S.arts.length+' artículos')}
  catch(e){const c=store.get(LS.cache,null);
    if(c&&c.articles&&!S.arts.length){S.arts=prep(c.articles);render();const m=Math.round((Date.now()-c.ts)/6e4);
      $('banner').textContent='Sin conexión: mostrando datos guardados (hace '+(m<60?m+' min':Math.round(m/60)+' h')+'). Guardar y eliminar pueden fallar.';$('banner').style.display='block'}
    else if(!S.arts.length)$('grid').innerHTML='<div class="empty"><h3>No se pudieron cargar los artículos</h3><p>'+esc(e.message)+'</p></div>';
    toast('❌ '+e.message)}}

// ===== FILTROS / RENDER =====
function filtered(){const ws=norm(S.q).split(/\s+/).filter(Boolean),bm=bms();
  const t=a=>new Date(a['Actualizado']||0).getTime()||0,po={Alta:0,Media:1,Baja:2};
  const r=S.arts.filter(a=>{const e=a['Estado']||'Resuelto';
    return(!S.cat||a['Categoría']===S.cat)&&(!S.pri||a['Prioridad']===S.pri)&&
      (!S.est||(S.est==='pend'?e!=='Resuelto':e===S.est))&&(!S.fav||bm.has(String(a['ID'])))&&ws.every(w=>a._h.includes(w))});
  return r.sort({oldest:(a,b)=>t(a)-t(b),title:(a,b)=>(a['Título']||'').localeCompare(b['Título']||'','es'),
    priority:(a,b)=>(po[a['Prioridad']]??1)-(po[b['Prioridad']]??1)||t(b)-t(a)}[S.sort]||((a,b)=>t(b)-t(a)))}

function render(){
  const A=S.arts,res=A.filter(a=>(a['Estado']||'Resuelto')==='Resuelto').length;
  const st=[['','total','Total',A.length],['Resuelto','est','Resueltos',res],['pend','est','Pendientes',A.length-res],['Alta','pri','Alta prioridad',A.filter(a=>a['Prioridad']==='Alta').length]];
  $('stats').innerHTML=st.map(s=>'<button class="stat'+((s[1]==='est'&&S.est===s[0])||(s[1]==='pri'&&S.pri===s[0])?' on':'')+'" data-st="'+s[1]+'" data-v="'+s[0]+'"><b>'+s[3]+'</b><span>'+s[2]+'</span></button>').join('');
  const cn={};A.forEach(a=>{const c=a['Categoría']||'Otro';cn[c]=(cn[c]||0)+1});
  $('cats').innerHTML=CATS.map(c=>'<button class="cat'+(S.cat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<b>'+(cn[c]||0)+'</b></button>').join('');
  $('sPri').value=S.pri;$('sEst').value=S.est;$('sSort').value=S.sort;
  const ch=[];if(S.cat)ch.push(['cat',S.cat]);if(S.pri)ch.push(['pri','Prioridad '+S.pri]);if(S.est)ch.push(['est',S.est==='pend'?'Pendientes':S.est]);if(S.fav)ch.push(['fav','Favoritos']);if(S.q)ch.push(['q','“'+S.q+'”']);
  $('chips').innerHTML=ch.map(c=>'<button class="chip" data-clear="'+c[0]+'">'+esc(c[1])+' ✕</button>').join('');
  const f=filtered(),bm=bms();$('count').textContent=f.length+' artículo'+(f.length!==1?'s':'');
  const n=bm.size;$('favN').hidden=!n;$('favN').textContent=n;
  $('grid').innerHTML=f.length?f.slice(0,S.shown).map(a=>{const p=a['Prioridad']||'Media',e=a['Estado']||'Resuelto',na=atts(a).length;
    return '<article class="card '+esc(p)+'" data-id="'+esc(a['ID'])+'" tabindex="0" role="button">'+
      '<button class="star'+(bm.has(String(a['ID']))?' on':'')+'" data-fav="'+esc(a['ID'])+'" aria-label="Favorito">★</button>'+
      '<h3>'+hl(a['Título'])+'</h3><p>'+hl(a['Descripción']||a['Solución']||'Sin descripción')+'</p>'+
      '<div class="meta"><span class="tag">'+esc(a['Categoría']||'Otro')+'</span><span class="tag '+esc(p)+'">'+esc(p)+'</span><span class="tag '+(e==='Resuelto'?'Resuelto':'')+'">'+esc(e)+'</span>'+(na?'<span>📎 '+na+'</span>':'')+'<span style="margin-left:auto">'+ago(a['Actualizado'])+'</span></div></article>'}).join('')
    :'<div class="empty"><h3>Sin resultados</h3><p>Prueba con otras palabras o limpia los filtros. Usa + para crear un artículo.</p></div>';
  $('more').hidden=f.length<=S.shown}

// ===== DETALLE + HASH =====
function route(){const m=location.hash.match(/^#\/articulo\/(.+)$/),a=m&&S.arts.find(x=>String(x['ID'])===decodeURIComponent(m[1]));
  if(!a){$('detail').style.display='none';$('list').style.display='';$('fab').hidden=false;if(S.y){window.scrollTo(0,S.y);S.y=0}return}
  const bm=bms().has(String(a['ID'])),at=atts(a);
  $('detail').innerHTML='<div class="dbar"><button class="btn" id="dBack">← Volver</button><button class="btn" id="dFav">'+(bm?'★ Favorito':'☆ Favorito')+'</button><button class="btn" id="dLink">🔗 Copiar enlace</button><button class="btn" id="dPrint">🖨 Imprimir</button><button class="btn p" id="dEdit">Editar</button></div>'+
    '<h1 style="font-size:22px;margin-bottom:8px">'+esc(a['Título'])+'</h1><div class="meta" style="margin-bottom:14px"><span class="tag">'+esc(a['Categoría']||'Otro')+'</span><span class="tag '+esc(a['Prioridad']||'Media')+'">'+esc(a['Prioridad']||'Media')+'</span><span class="tag">'+esc(a['Estado']||'Resuelto')+'</span><span>Actualizado '+esc(ago(a['Actualizado']))+'</span></div>'+
    '<div class="sec"><h4>Descripción del problema</h4><div class="md">'+md(a['Descripción'])+'</div></div>'+
    '<div class="sec sol"><h4>Solución / procedimiento</h4><div class="md">'+md(a['Solución'])+'</div></div>'+
    (a['Notas']?'<div class="sec"><h4>Notas adicionales</h4><div class="md">'+md(a['Notas'])+'</div></div>':'')+
    (at.length?'<div class="sec"><h4>Adjuntos ('+at.length+')</h4>'+at.map(f=>{const u=safeUrl(f.url);return '<a class="att" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">📎 '+esc(f.name||'Adjunto')+(/\.(png|jpe?g|gif|webp)(\?|$)/i.test(u)?'<img loading="lazy" src="'+esc(u)+'" alt="">':'')+'</a>'}).join('')+'</div>':'');
  $('detail').dataset.id=a['ID'];$('list').style.display='none';$('detail').style.display='block';$('fab').hidden=true;window.scrollTo(0,0)}
function openDetail(id){S.y=window.scrollY;S.inApp=true;location.hash='#/articulo/'+encodeURIComponent(id)}
function closeDetail(){if(S.inApp){S.inApp=false;history.back()}else{history.replaceState(null,'',location.pathname+location.search);route()}}
window.addEventListener('hashchange',route);

// ===== FORMULARIO =====
const F=['fTit','fCat','fPri','fEst','fDes','fSol','fNot'];
function renderAtts(list){$('atts').innerHTML=list.map((f,i)=>'<div class="arow"><input placeholder="Nombre (Manual.pdf)" value="'+esc(f.name)+'" data-a="name" data-i="'+i+'"><input type="url" placeholder="https://drive.google.com/…" value="'+esc(f.url)+'" data-a="url" data-i="'+i+'"><button type="button" class="btn d" data-rm="'+i+'" aria-label="Quitar">✕</button></div>').join('')}
let AT=[];
function openForm(a){const isNew=!a,d=isNew?store.get(LS.draft,null):null;
  $('mTitle').textContent=isNew?'Nuevo artículo':'Editar artículo';$('fId').value=a?a['ID']:'';
  $('fCat').innerHTML='<option value="">Seleccionar…</option>'+CATS.map(c=>'<option>'+esc(c)+'</option>').join('');
  const v=a?{fTit:a['Título'],fCat:a['Categoría'],fPri:a['Prioridad'],fEst:a['Estado'],fDes:a['Descripción'],fSol:a['Solución'],fNot:a['Notas']}:(d||{fPri:'Media',fEst:'Resuelto'});
  F.forEach(k=>$(k).value=v[k]||'');AT=a?atts(a).map(f=>({name:f.name||'',url:f.url})):[];
  renderAtts(AT);S.dirty=false;$('ov').classList.add('on');if(d)toast('📝 Borrador recuperado')}
function closeForm(force){if(S.dirty&&!force&&!confirm('Hay cambios sin guardar. ¿Cerrar de todos modos?'))return;$('ov').classList.remove('on')}
$('form').addEventListener('input',e=>{S.dirty=true;if(e.target.dataset.a){AT[e.target.dataset.i][e.target.dataset.a]=e.target.value}
  if(!$('fId').value){const d={};F.forEach(k=>d[k]=$(k).value);store.set(LS.draft,d)}});
$('addAtt').onclick=()=>{AT.push({name:'',url:''});renderAtts(AT);S.dirty=true};
$('atts').addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){AT.splice(+r.dataset.rm,1);renderAtts(AT)}});
$('cancel').onclick=()=>closeForm();
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeForm()});
$('form').addEventListener('submit',async e=>{e.preventDefault();const id=$('fId').value,b=$('save'),old=b.textContent;
  const data={'Título':$('fTit').value.trim(),'Categoría':$('fCat').value,'Prioridad':$('fPri').value,'Estado':$('fEst').value,'Descripción':$('fDes').value.trim(),'Solución':$('fSol').value.trim(),'Notas':$('fNot').value.trim(),
    'Adjuntos':AT.filter(f=>safeUrl(f.url)!=='#').map(f=>({name:(f.name||'').trim()||'Adjunto sin nombre',url:safeUrl(f.url)}))};
  if(AT.some(f=>f.url.trim()&&safeUrl(f.url)==='#'))return toast('⚠️ Los enlaces deben empezar con http:// o https://');
  b.disabled=true;b.textContent='Guardando…';
  try{id?await api('update',{id,data:JSON.stringify(data)}):await api('create',{data:JSON.stringify(data)});
    toast(id?'✅ Artículo actualizado':'✅ Artículo creado');if(!id)localStorage.removeItem(LS.draft);S.dirty=false;closeForm(true);await pull()}
  catch(err){toast('❌ '+err.message)}finally{b.disabled=false;b.textContent=old}});
async function del(id){if(!confirm('¿Eliminar este artículo permanentemente?'))return;
  try{await api('delete',{id});toast('🗑️ Artículo eliminado');closeDetail();await pull()}catch(e){toast('❌ '+e.message)}}

// ===== EVENTOS =====
$('grid').addEventListener('click',e=>{const f=e.target.closest('[data-fav]');
  if(f){e.stopPropagation();const s=bms(),id=f.dataset.fav;s.has(id)?s.delete(id):s.add(id);store.set(LS.bm,[...s]);toast(s.has(id)?'⭐ Añadido a favoritos':'☆ Quitado de favoritos');return render()}
  const c=e.target.closest('[data-id]');if(c)openDetail(c.dataset.id)});
$('grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.id)openDetail(e.target.dataset.id)});
$('cats').addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){S.cat=S.cat===c.dataset.cat?'':c.dataset.cat;S.shown=PAGE;render()}});
$('stats').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b)return;const k=b.dataset.st,v=b.dataset.v;
  if(k==='total'){S.est=S.pri='';S.cat=''}else if(k==='est')S.est=S.est===v?'':v;else S.pri=S.pri===v?'':v;S.shown=PAGE;render()});
$('chips').addEventListener('click',e=>{const c=e.target.closest('[data-clear]');if(!c)return;const k=c.dataset.clear;
  if(k==='q'){S.q='';$('q').value=''}else if(k==='fav')S.fav=false;else S[k]='';S.shown=PAGE;render()});
$('sPri').onchange=e=>{S.pri=e.target.value;S.shown=PAGE;render()};
$('sEst').onchange=e=>{S.est=e.target.value;S.shown=PAGE;render()};
$('sSort').onchange=e=>{S.sort=e.target.value;render()};
$('more').onclick=()=>{S.shown+=PAGE;render()};
let qT;$('q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value;S.shown=PAGE;render()},150)});
$('bFav').onclick=()=>{S.fav=!S.fav;S.shown=PAGE;render();if(location.hash)closeDetail()};
$('bSync').onclick=()=>pull(true);
$('fab').onclick=()=>openForm();
$('bTheme').onclick=()=>{const dark=matchMedia('(prefers-color-scheme:dark)').matches,cur=document.documentElement.dataset.theme||(dark?'dark':'light'),n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set(LS.theme,n)};
$('bCsv').onclick=()=>{const f=filtered();if(!f.length)return toast('⚠️ No hay artículos para exportar');
  const cols=['ID','Título','Categoría','Prioridad','Estado','Descripción','Solución','Notas','Actualizado'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[cols.map(q).join(',')].concat(f.map(a=>cols.map(c=>q(a[c])).join(','))).join('\r\n');
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));l.download='knowledge-base-'+new Date().toISOString().slice(0,10)+'.csv';l.click();URL.revokeObjectURL(l.href)};
$('detail').addEventListener('click',e=>{const id=$('detail').dataset.id,t=e.target;
  if(t.closest('#dBack'))closeDetail();
  else if(t.closest('#dEdit'))openForm(S.arts.find(a=>String(a['ID'])===id));
  else if(t.closest('#dPrint'))window.print();
  else if(t.closest('#dFav')){const s=bms();s.has(id)?s.delete(id):s.add(id);store.set(LS.bm,[...s]);route();render()}
  else if(t.closest('#dLink'))navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Enlace copiado'),()=>toast('No se pudo copiar'));
  else if(t.dataset.copy!==undefined)navigator.clipboard.writeText(t.nextElementSibling.textContent).then(()=>toast('📋 Copiado'))});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('ov').classList.contains('on'))closeForm();
  if((e.key==='/'||(e.ctrlKey&&e.key.toLowerCase()==='k'))&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}});
addEventListener('offline',()=>toast('Sin conexión'));addEventListener('online',()=>pull());

// ===== INICIO (una sola vez) =====
(function boot(){
  const th=store.get(LS.theme,null);if(th)document.documentElement.dataset.theme=th;
  const c=store.get(LS.cache,null);if(c&&c.articles&&c.articles.length){S.arts=prep(c.articles);render();route()}
  pull();
})();
</script>
</body>
</html>
